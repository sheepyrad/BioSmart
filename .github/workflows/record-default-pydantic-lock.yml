name: record default pydantic lock
on:
  push:
    branches:
      - cursor/boltz2-scorer-worker-90d3
    paths:
      - .github/workflows/record-default-pydantic-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/boltz2-scorer-worker-90d3
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: insert default pydantic wheels
        run: |
          python3 << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("pixi.lock")
          text = path.read_text(encoding="utf-8")
          start = text.index("\n  default:\n")
          end = text.index("\n  fabind:\n")
          block = text[start:end]
          inserts = [
              (
                  "      - pypi: https://files.pythonhosted.org/packages/67/58/317b0134129b556a93a3b0afe00ee675b5657f0155509e22fcb853bafe2d/grpcio_status-1.71.2-py3-none-any.whl\n",
                  "      - pypi: https://files.pythonhosted.org/packages/67/81/4add07e5172b7ac40d8ed5ff580409a7801a4fe26d529bdd915401dabfbe/typing_inspection-0.4.4-py3-none-any.whl\n",
              ),
              (
                  "      - pypi: https://files.pythonhosted.org/packages/99/5d/8268b644392ee874ee82a635cd0df1773de230bde356c38de28e298392cc/parso-0.8.7-py2.py3-none-any.whl\n",
                  "      - pypi: https://files.pythonhosted.org/packages/99/91/8acff4f5e50511b911bbccb72b8628a49c68ce14148cd9f6431094859a90/annotated_types-0.8.0-py3-none-any.whl\n",
              ),
              (
                  "      - pypi: https://files.pythonhosted.org/packages/cf/58/8acf1b3e91c58313ce5cb67df61001fc9dcd21be4fadb76c1a2d540e09ed/fqdn-1.5.1-py3-none-any.whl\n",
                  "      - pypi: https://files.pythonhosted.org/packages/cf/bc/3fa2d76b83162820a17da7f645b28d1cba99fc8e1e5fc6517067ec450fa1/pydantic_core-2.46.5-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl\n",
              ),
              (
                  "      - pypi: https://files.pythonhosted.org/packages/e7/e7/80988e32bf6f73919a113473a604f5a8f09094de312b9d52b79c2df7612b/jupyter_core-5.9.1-py3-none-any.whl\n",
                  "      - pypi: https://files.pythonhosted.org/packages/eb/47/c95ffc2009878c7aac0c5e08528022dcb885933252a88b5f170058014464/pydantic-2.13.5-py3-none-any.whl\n",
              ),
          ]
          for anchor, addition in inserts:
              if addition in block:
                  continue
              idx = block.find(anchor)
              if idx < 0 or block.find(anchor, idx + len(anchor)) >= 0:
                  raise SystemExit("anchor not unique in the default environment")
              at = idx + len(anchor)
              block = block[:at] + addition + block[at:]
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "6c60094a552fff440e99d3f17691674e740062a2915b13f28c7dceb39fccc811"
          if digest != expected:
              raise SystemExit(f"lock hash {digest}")
          PY
      - name: commit the lock
        run: |
          git config user.name "3090_PC_3"
          git config user.email "43571465+sheepyrad@users.noreply.github.com"
          git add pixi.lock
          git commit -m "Record pydantic on the default pixi environment."
          git push origin HEAD:cursor/boltz2-scorer-worker-90d3
